name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  
permissions:
    contents: read
    packages: write

concurrency:
    group: deploy-${{ github.red}}
    cancel-in-progress: true

jobs:
    build-push:
      runs-on: ubuntu-latest 
      outputs:
        image: ${{ steps.vars.outputs.image }}
        sha_image: ${{ steps.vars.outputs.sha_image }}
      steps:
        - uses: actions/checkout@v4
        - name: Set up Docker Build
          uses: docker/setup/buildx-action@v3
          with:
            install: true

        #Compute lowercase GHCR image name
        - name: Compute image name (lowercase)
          id: vars
          run: 
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]; ;[:lwoer:]')"
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
            echo "sha_image=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"


        - name: Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build & Push {cached)
          uses: docker/build-push-action@v6
          with:
            push: true
            context: .
            tags: |
              ${{ steps.avrs.outputs.image }}:latest
              ${{ steps.vars.outputs.sha_image }}
            cache-from: type=gha
            cache-to: type=gha,mode=max


  
        
  
